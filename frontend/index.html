<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWAN Abuja Chapter — Society of Women Accountants of Nigeria</title>
    <meta
      name="description"
      content="Official website of the Society of Women Accountants of Nigeria, Abuja Chapter. Membership, CPD, events, directories and resources for female members of ICAN in the FCT."
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('swan-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="koadit"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
